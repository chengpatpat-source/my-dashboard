<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #fff0f3; color: #333; padding: 20px; display: flex; flex-direction: column; gap: 20px; max-width: 1000px; margin: 0 auto; }
        
        /* 頂部時鐘列 */
        .header { background: #ffffff; padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; }
        .clock { font-size: 3rem; font-weight: bold; color: #0077b6; }
        .date { font-size: 1.2rem; color: #ff758f; font-weight: 600; }
        
        /* 主內容兩欄佈局 */
        .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .main-grid { grid-template-columns: 1fr; } }
        
        /* 卡片通用樣式 */
        .card { background: #ffffff; padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .card-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 15px; color: #444; display: flex; align-items: center; gap: 8px; }
        
        /* 天氣樣式 */
        .temp-display { font-size: 3.5rem; font-weight: bold; color: #fb8500; margin: 10px 0; }
        .weather-info { display: flex; gap: 15px; font-size: 0.95rem; color: #666; margin-top: 10px; }
        
        /* 巴士 ETA 樣式 */
        .eta-box { background: #f8f9fa; border-radius: 12px; padding: 12px; margin-bottom: 10px; border-left: 5px solid #0077b6; }
        .route-name { font-size: 1.2rem; font-weight: bold; color: #0077b6; }
        .eta-time { font-size: 1.1rem; font-weight: bold; color: #2a9d8f; float: right; }
        
        /* 電台控制列 */
        .radio-bar { background: #ffffff; padding: 15px 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .radio-btn { background: #ff758f; color: white; border: none; padding: 8px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        .radio-btn:hover { background: #ff4d6d; }
    </style>
</head>
<body>

    <!-- 頂部時間區塊 -->
    <div class="header">
        <div>
            <div class="clock" id="clock">00:00:00</div>
            <div class="date" id="date">----年--月--日</div>
        </div>
        <button class="radio-btn" onclick="location.reload()">↺ 更新</button>
    </div>

    <!-- 雙欄資訊區塊 -->
    <div class="main-grid">
        <!-- 天氣卡片 -->
        <div class="card">
            <div class="card-title">☀️ 香港即時天氣</div>
            <div class="temp-display" id="temp">--°C</div>
            <div class="weather-info">
                <span>相對濕度: <strong id="humidity">--%</strong></span>
            </div>
            <div id="weather-warning" style="margin-top:10px; color:#e63946; font-size:0.9rem;"></div>
        </div>

        <!-- 巴士到站卡片 -->
        <div class="card">
            <div class="card-title">🚌 巴士到站時間 (64K)</div>
            <div id="bus-eta-container">載入中...</div>
        </div>
    </div>

    <!-- 底部電台播放器 -->
    <div class="radio-bar">
        <span style="font-weight:bold;">📻 直播電台</span>
        <div>
            <button class="radio-btn" onclick="playRadio('https://rthk.hk/live/radio1.m3u8')">香港電台第一台</button>
            <button class="radio-btn" onclick="playRadio('https://rthk.hk/live/radio2.m3u8')">香港電台第二台</button>
        </div>
        <audio id="audio-player" controls style="height:30px;"></audio>
    </div>

    <script>
        // 1. 時鐘功能
        function updateClock() {
            var now = new Date();
            var h = String(now.getHours()).padStart(2, '0');
            var m = String(now.getMinutes()).padStart(2, '0');
            var s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').innerText = h + ':' + m + ':' + s;
            
            var year = now.getFullYear();
            var month = String(now.getMonth() + 1).padStart(2, '0');
            var date = String(now.getDate()).padStart(2, '0');
            var days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            document.getElementById('date').innerText = year + '年' + month + '月' + date + '日 (' + days[now.getDay()] + ')';
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 2. 香港天文台 API 天氣數據
        async function fetchWeather() {
            try {
                const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                const data = await res.json();
                
                // 取得氣溫 (以沙田/大埔預設或全局平均)
                if(data.temperature && data.temperature.data.length > 0) {
                    document.getElementById('temp').innerText = data.temperature.data[0].value + '°C';
                }
                if(data.humidity && data.humidity.data.length > 0) {
                    document.getElementById('humidity').innerText = data.humidity.data[0].value + '%';
                }
            } catch(e) {
                console.error("天氣載入失敗", e);
            }
        }
        fetchWeather();
        setInterval(fetchWeather, 600000); // 10分鐘更新一次

        // 3. 香港九巴 API 64K 到站時間 (範例 Stop ID)
        async function fetchBusEta() {
            // 預設查詢九巴 64K 路線
            const stopId = '9D48C1C89F3876B4'; // 此處可替換為你家附近具體的 Stop ID
            try {
                const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${stopId}`);
                const data = await res.json();
                const etas = data.data.filter(item => item.route === '64K').slice(0, 2);
                
                let html = '';
                if(etas.length === 0) {
                    html = '<div>暫無即時班次資料</div>';
                } else {
                    etas.forEach(eta => {
                        const etaTime = eta.eta ? new Date(eta.eta).toTimeString().substring(0, 5) : '未知';
                        html += `
                            <div class="eta-box">
                                <span class="route-name">64K 往 ${eta.dest_tc}</span>
                                <span class="eta-time">${etaTime}</span>
                            </div>
                        `;
                    });
                }
                document.getElementById('bus-eta-container').innerHTML = html;
            } catch(e) {
                document.getElementById('bus-eta-container').innerText = '巴士資料載入失敗';
            }
        }
        fetchBusEta();
        setInterval(fetchBusEta, 30000); // 30秒更新一次

        // 4. 電台播放控制
        function playRadio(url) {
            var player = document.getElementById('audio-player');
            player.src = url;
            player.play();
        }
    </script>
</body>
</html>
