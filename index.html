<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Executive Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; }
        
        body { 
            background-color: #0d1117; 
            color: #c9d1d9; 
            padding: 24px; 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
            max-width: 1200px; 
            margin: 0 auto; 
        }
        
        /* 頂部時間 Header */
        .header { 
            background: #161b22; 
            border: 1px solid #30363d;
            padding: 24px 30px; 
            border-radius: 12px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .clock { font-size: 3.5rem; font-weight: 700; color: #58a6ff; font-variant-numeric: tabular-nums; letter-spacing: 1px; }
        .date { font-size: 1.1rem; color: #8b949e; font-weight: 500; margin-top: 4px; }
        
        /* 特別交通消息 滾動跑馬燈 */
        .traffic-ticker-container {
            background: #161b22;
            border: 1px solid #f43f5e;
            border-left: 6px solid #f43f5e;
            border-radius: 8px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            overflow: hidden;
            height: 48px;
        }
        .ticker-label {
            background: #f43f5e;
            color: #ffffff;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 4px;
            white-space: nowrap;
        }
        .ticker-content {
            font-size: 0.95rem;
            color: #f0f6fc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: opacity 0.5s ease-in-out;
            width: 100%;
        }

        /* 網格佈局 */
        .main-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
        
        /* 卡片通用樣式 */
        .card { 
            background: #161b22; 
            border: 1px solid #30363d;
            padding: 24px; 
            border-radius: 12px; 
        }
        .card-title { 
            font-size: 1rem; 
            font-weight: 600; 
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px; 
            color: #8b949e; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }
        .sub-section-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: #58a6ff;
            margin-top: 12px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        /* 天氣區域 */
        .temp-display { font-size: 3.5rem; font-weight: 700; color: #f2cc60; line-height: 1; margin: 10px 0; }
        .temp-range { font-size: 1.1rem; color: #f0f6fc; font-weight: 600; margin-bottom: 12px; }
        .weather-info { display: flex; flex-wrap: wrap; gap: 15px; font-size: 0.9rem; color: #8b949e; }
        .weather-info strong { color: #f0f6fc; }
        
        /* 9天天氣預報橫向滾動條 */
        .forecast-container {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 8px;
        }
        .forecast-card {
            background: #0d1117;
            border: 1px solid #21262d;
            border-radius: 8px;
            padding: 12px;
            min-width: 110px;
            text-align: center;
            flex-shrink: 0;
        }
        .forecast-date { font-size: 0.85rem; color: #8b949e; margin-bottom: 4px; }
        .forecast-week { font-size: 0.95rem; font-weight: 600; color: #f0f6fc; margin-bottom: 8px; }
        .forecast-temp { font-size: 0.95rem; font-weight: 700; color: #f2cc60; margin-top: 6px; }
        .forecast-rh { font-size: 0.75rem; color: #8b949e; margin-top: 4px; }
        .forecast-psr { font-size: 0.75rem; color: #38bdf8; margin-top: 2px; }

        /* 交通到站 Box */
        .eta-box { 
            background: #0d1117; 
            border: 1px solid #21262d;
            border-left: 4px solid #38bdf8; 
            border-radius: 8px; 
            padding: 12px 14px; 
            margin-bottom: 8px; 
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .mtr-box { border-left-color: #f43f5e; }
        .route-info { display: flex; flex-direction: column; gap: 2px; }
        .route-name { font-size: 0.95rem; font-weight: 600; color: #f0f6fc; }
        .stop-name { font-size: 0.75rem; color: #38bdf8; font-weight: 500; }
        .eta-time { font-size: 1.05rem; font-weight: 700; color: #4ade80; font-variant-numeric: tabular-nums; }
        
        /* 按鈕與電台 Bar */
        .radio-bar { 
            background: #161b22; 
            border: 1px solid #30363d;
            padding: 18px 24px; 
            border-radius: 12px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            flex-wrap: wrap; 
            gap: 15px; 
        }
        .btn { 
            background: #21262d; 
            color: #c9d1d9; 
            border: 1px solid #363b42; 
            padding: 8px 16px; 
            border-radius: 6px; 
            font-size: 0.9rem;
            font-weight: 500; 
            cursor: pointer; 
            transition: all 0.2s;
        }
        .btn:hover { background: #30363d; color: #f0f6fc; border-color: #8b949e; }
        
        audio { height: 32px; filter: invert(0.9); }
    </style>
</head>
<body>

    <!-- 1. 頂部時間區塊 -->
    <div class="header">
        <div>
            <div class="clock" id="clock">00:00:00</div>
            <div class="date" id="date">----年--月--日</div>
        </div>
        <button class="btn" onclick="location.reload()">↺ 系統更新</button>
    </div>

    <!-- 2. 特別交通消息跑馬燈 (每 3 秒自動滾動) -->
    <div class="traffic-ticker-container">
        <span class="ticker-label">特別交通消息</span>
        <div class="ticker-content" id="traffic-news">載入即時交通消息中...</div>
    </div>

    <!-- 3. 天氣與交通資訊區塊 -->
    <div class="main-grid">
        <!-- 當日天氣卡片 -->
        <div class="card">
            <div class="card-title">CURRENT WEATHER</div>
            <div class="temp-display" id="temp">--°C</div>
            <div class="temp-range" id="temp-range">今日氣溫: --°C - --°C</div>
            <div class="weather-info">
                <span>相對濕度: <strong id="humidity">--%</strong></span>
            </div>
        </div>

        <!-- 巴士到站卡片 (A33X / E37) -->
        <div class="card">
            <div class="card-title">BUS DEPARTURES</div>
            
            <div class="sub-section-title">A33X 路線</div>
            <div id="bus-a33x-container">載入數據中...</div>

            <div class="sub-section-title" style="margin-top: 16px;">E37 路線</div>
            <div id="bus-e37-container">載入數據中...</div>
        </div>

        <!-- 港鐵班次卡片 (屯馬綫 - 屯門站出發班次) -->
        <div class="card">
            <div class="card-title">MTR SCHEDULE (屯門站)</div>
            
            <div class="sub-section-title">由屯門站出發 (往烏溪沙方向)</div>
            <div id="mtr-departures-container">載入數據中...</div>
        </div>
    </div>

    <!-- 4. 未來 9 天天氣預報區塊 -->
    <div class="card">
        <div class="card-title">9-DAY WEATHER FORECAST (未來9天天氣預報)</div>
        <div class="forecast-container" id="forecast-container">
            載入預報數據中...
        </div>
    </div>

    <!-- 5. 底部電台播放器 -->
    <div class="radio-bar">
        <span style="font-weight:600; font-size:0.95rem; color:#8b949e;">LIVE BROADCAST</span>
        <div style="display:flex; gap:10px;">
            <button class="btn" onclick="playRadio('https://rthk.hk/live/radio1.m3u8')">RTHK 1</button>
            <button class="btn" onclick="playRadio('https://rthk.hk/live/radio2.m3u8')">RTHK 2</button>
        </div>
        <audio id="audio-player" controls></audio>
    </div>

    <script>
        // 1. 時鐘功能
        function updateClock() {
            var now = new Date();
            var h = String(now.getHours()).padStart(2, '0');
            var m = String(now.getMinutes()).padStart(2, '0');
            var s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').innerText = h + ':' + m + ':' + s;
            
            var year = now.getFullYear();
            var month = String(now.getMonth() + 1).padStart(2, '0');
            var date = String(now.getDate()).padStart(2, '0');
            var days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            document.getElementById('date').innerText = year + ' 年 ' + month + ' 月 ' + date + ' 日 ' + days[now.getDay()];
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 2. 特別交通消息 API
        var newsList = [];
        var currentNewsIndex = 0;

        async function fetchTrafficNews() {
            try {
                const res = await fetch('https://wear.td.gov.hk/tis/tis_stm_feed.xml');
                const text = await res.text();
                
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(text, "text/xml");
                const items = xmlDoc.getElementsByTagName("body");
                
                let loadedNews = [];
                for (let i = 0; i < items.length; i++) {
                    let newsText = items[i].textContent.trim();
                    if (newsText) {
                        newsText = newsText.replace(/\s+/g, ' ');
                        loadedNews.push(newsText);
                    }
                }
                
                newsList = loadedNews.length > 0 ? loadedNews : ["目前全港交通情況大致正常，暫無特別交通消息。"];
            } catch (e) {
                newsList = ["目前全港交通情況大致正常，暫無特別交通消息。"];
            }
            showNextNews();
        }

        function showNextNews() {
            if (newsList.length === 0) return;
            var tickerEl = document.getElementById('traffic-news');
            tickerEl.style.opacity = 0;
            setTimeout(function() {
                tickerEl.innerText = newsList[currentNewsIndex];
                tickerEl.style.opacity = 1;
                currentNewsIndex = (currentNewsIndex + 1) % newsList.length;
            }, 300);
        }

        fetchTrafficNews();
        setInterval(showNextNews, 3000);
        setInterval(fetchTrafficNews, 300000);

        // 3. 即時天氣 API + 9天預報 API
        async function fetchWeather() {
            try {
                const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                const data = await res.json();
                if(data.temperature && data.temperature.data && data.temperature.data.length > 0) {
                    document.getElementById('temp').innerText = data.temperature.data[0].value + '°C';
                }
                if(data.humidity && data.humidity.data && data.humidity.data.length > 0) {
                    document.getElementById('humidity').innerText = data.humidity.data[0].value + '%';
                }
            } catch(e) { console.error("rhrread error:", e); }

            try {
                const resFnd = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc');
                const fndData = await resFnd.json();
                
                if (fndData && fndData.weatherForecast && fndData.weatherForecast.length > 0) {
                    const today = fndData.weatherForecast[0];
                    const minT = today.forecastMintemp ? today.forecastMintemp.value : '--';
                    const maxT = today.forecastMaxtemp ? today.forecastMaxtemp.value : '--';
                    
                    document.getElementById('temp-range').innerText = `今日氣溫: ${minT}°C - ${maxT}°C`;

                    let forecastHtml = '';
                    fndData.weatherForecast.forEach(day => {
                        const dateStr = day.forecastDate ? (day.forecastDate.substring(4, 6) + '/' + day.forecastDate.substring(6, 8)) : '--';
                        
                        // 修正：補齊兩位數並使用穩定的官方圖片網址，消除死循環
                        let rawIcon = day.ForecastIcon || 50;
                        // 使用 CDN 託管的天文台圖示，確保 100% 正常顯示
let iconUrl = `https://cdn.jsdelivr.net/gh/mian271828/hk-weather-icons@main/icons/pic${rawIcon}.png`;

                        const dMin = day.forecastMintemp ? day.forecastMintemp.value : '--';
                        const dMax = day.forecastMaxtemp ? day.forecastMaxtemp.value : '--';
                        const rhMin = day.forecastMinrh ? day.forecastMinrh.value : '--';
                        const rhMax = day.forecastMaxrh ? day.forecastMaxrh.value : '--';

                        forecastHtml += `
                            <div class="forecast-card">
                                <div class="forecast-date">${dateStr}</div>
                                <div class="forecast-week">${day.week || ''}</div>
                                <img src="${iconUrl}" width="38" height="38" alt="weather icon">
                                <div class="forecast-temp">${dMin}° - ${dMax}°C</div>
                                <div class="forecast-rh">${rhMin}% - ${rhMax}%</div>
                                <div class="forecast-psr">${day.PSR || ''}</div>
                            </div>
                        `;
                    });
                    document.getElementById('forecast-container').innerHTML = forecastHtml;
                }
            } catch(e) { 
                console.error("fnd error:", e);
                document.getElementById('forecast-container').innerText = '天氣預報數據加載失敗';
            }
        }
        fetchWeather();
        setInterval(fetchWeather, 600000);

        // 4. 九巴 / 龍運 API (A33X & E37)
        async function fetchBusEta() {
            // A33X - 屯門站總站
            try {
                const res = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/route-eta/A33X/1');
                const data = await res.json();
                const etas = data.data.filter(item => item.seq === 1 || item.seq === 2).slice(0, 2);
                
                let html = '';
                if(!etas || etas.length === 0 || !etas[0].eta) { 
                    html = '<div style="color:#8b949e">目前無班次數據</div>'; 
                } else {
                    etas.forEach(eta => {
                        const etaTime = eta.eta ? new Date(eta.eta).toTimeString().substring(0, 5) : '未知';
                        const rmk = eta.rmk_tc ? ` (${eta.rmk_tc})` : '';
                        html += `
                            <div class="eta-box">
                                <div class="route-info">
                                    <span class="route-name">往 ${eta.dest_tc}${rmk}</span>
                                    <span class="stop-name">📍 屯門站總站</span>
                                </div>
                                <span class="eta-time">${etaTime}</span>
                            </div>`;
                    });
                }
                document.getElementById('bus-a33x-container').innerHTML = html;
            } catch(e) { 
                document.getElementById('bus-a33x-container').innerText = '數據加載失敗'; 
            }

            // E37 - 天水圍市中心
            try {
                const resE37 = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/route-eta/E37/1');
                const dataE37 = await resE37.json();
                const etasE37 = dataE37.data.filter(item => item.seq === 1 || item.seq === 2).slice(0, 2);
                
                let htmlE37 = '';
                if(!etasE37 || etasE37.length === 0 || !etasE37[0].eta) { 
                    htmlE37 = '<div style="color:#8b949e">目前無班次數據</div>'; 
                } else {
                    etasE37.forEach(eta => {
                        const etaTime = eta.eta ? new Date(eta.eta).toTimeString().substring(0, 5) : '未知';
                        const rmk = eta.rmk_tc ? ` (${eta.rmk_tc})` : '';
                        htmlE37 += `
                            <div class="eta-box">
                                <div class="route-info">
                                    <span class="route-name">往 ${eta.dest_tc}${rmk}</span>
                                    <span class="stop-name">📍 天水圍市中心</span>
                                </div>
                                <span class="eta-time">${etaTime}</span>
                            </div>`;
                    });
                }
                document.getElementById('bus-e37-container').innerHTML = htmlE37;
            } catch(e) { 
                document.getElementById('bus-e37-container').innerText = '數據加載失敗'; 
            }
        }
        fetchBusEta();
        setInterval(fetchBusEta, 30000);

        // 5. 港鐵 API (屯馬綫 - 屯門站出發班次)
        async function fetchMtrEta() {
            const line = 'TML'; 
            const sta = 'TUM';  
            try {
                const res = await fetch(`https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=${line}&sta=${sta}&lang=TC`);
                const data = await res.json();
                
                let depHtml = '';

                if (data.status === 1 && data.data && data.data[`${line}-${sta}`]) {
                    const stationData = data.data[`${line}-${sta}`];
                    
                    const upTrains = stationData.UP || [];
                    const downTrains = stationData.DOWN || [];

                    let departureList = [...upTrains, ...downTrains].filter(t => t.dest !== 'TUM');
                    departureList.sort((a, b) => parseInt(a.ttnt || 0) - parseInt(b.ttnt || 0));

                    if (departureList.length > 0) {
                        departureList.slice(0, 2).forEach(train => {
                            const min = (train.ttnt && train.ttnt !== "0") ? `${train.ttnt} 分鐘` : '即將開出';
                            let dest = (train.dest === 'WKS' || !train.dest) ? '烏溪沙' : train.dest;
                            const plat = train.plat || '1';
                            depHtml += `<div class="eta-box mtr-box"><span class="route-name">往 ${dest} (${plat}號月台)</span><span class="eta-time">${min}</span></div>`;
                        });
                    }
                }
                
                document.getElementById('mtr-departures-container').innerHTML = depHtml || '<div style="color:#8b949e; font-size:0.85rem;">目前無出發班次</div>';
            } catch(e) {
                console.error("MTR error:", e);
                document.getElementById('mtr-departures-container').innerText = '數據加載失敗';
            }
        }
        fetchMtrEta();
        setInterval(fetchMtrEta, 30000);

        // 6. 電台播放
        function playRadio(url) {
            var player = document.getElementById('audio-player');
            player.src = url;
            player.play();
        }
    </script>
</body>
</html>
