<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Executive Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; }
        
        /* 專業深色背景 */
        body { 
            background-color: #0d1117; 
            color: #c9d1d9; 
            padding: 24px; 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
            max-width: 1200px; 
            margin: 0 auto; 
        }
        
        /* 頂部時鐘 Header */
        .header { 
            background: #161b22; 
            border: 1px solid #30363d;
            padding: 24px 30px; 
            border-radius: 12px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .clock { font-size: 3.5rem; font-weight: 700; color: #58a6ff; font-variant-numeric: tabular-nums; letter-spacing: 1px; }
        .date { font-size: 1.1rem; color: #8b949e; font-weight: 500; margin-top: 4px; }
        
        /* 網格佈局 */
        .main-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
        
        /* 專業卡片樣式 */
        .card { 
            background: #161b22; 
            border: 1px solid #30363d;
            padding: 24px; 
            border-radius: 12px; 
        }
        .card-title { 
            font-size: 1rem; 
            font-weight: 600; 
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px; 
            color: #8b949e; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }
        
        /* 天氣樣式 */
        .temp-display { font-size: 3.8rem; font-weight: 700; color: #f2cc60; line-height: 1; margin: 10px 0; }
        .weather-info { display: flex; gap: 20px; font-size: 0.95rem; color: #8b949e; margin-top: 15px; }
        .weather-info strong { color: #f0f6fc; }
        
        /* 交通到站 Box */
        .eta-box { 
            background: #0d1117; 
            border: 1px solid #21262d;
            border-left: 4px solid #38bdf8; 
            border-radius: 8px; 
            padding: 14px 16px; 
            margin-bottom: 12px; 
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .mtr-box { border-left-color: #f43f5e; } /* 港鐵專用紅邊 */
        .route-name { font-size: 1rem; font-weight: 600; color: #f0f6fc; }
        .eta-time { font-size: 1.1rem; font-weight: 700; color: #4ade80; font-variant-numeric: tabular-nums; }
        
        /* 按鈕與電台 Bar */
        .radio-bar { 
            background: #161b22; 
            border: 1px solid #30363d;
            padding: 18px 24px; 
            border-radius: 12px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            flex-wrap: wrap; 
            gap: 15px; 
        }
        .btn { 
            background: #21262d; 
            color: #c9d1d9; 
            border: 1px solid #363b42; 
            padding: 8px 16px; 
            border-radius: 6px; 
            font-size: 0.9rem;
            font-weight: 500; 
            cursor: pointer; 
            transition: all 0.2s;
        }
        .btn:hover { background: #30363d; color: #f0f6fc; border-color: #8b949e; }
        .btn-primary { background: #238636; color: #ffffff; border: none; }
        .btn-primary:hover { background: #2ea043; }
        
        audio { height: 32px; filter: invert(0.9); } /* 適應深色主題的播放器 */
    </style>
</head>
<body>

    <!-- 頂部時間區塊 -->
    <div class="header">
        <div>
            <div class="clock" id="clock">00:00:00</div>
            <div class="date" id="date">----年--月--日</div>
        </div>
        <button class="btn" onclick="location.reload()">↺ 系統更新</button>
    </div>

    <!-- 多欄資訊區塊 -->
    <div class="main-grid">
        <!-- 1. 天氣卡片 -->
        <div class="card">
            <div class="card-title">WEATHER METRICS</div>
            <div class="temp-display" id="temp">--°C</div>
            <div class="weather-info">
                <span>相對濕度: <strong id="humidity">--%</strong></span>
            </div>
        </div>

        <!-- 2. 巴士到站卡片 -->
        <div class="card">
            <div class="card-title">BUS DEPARTURES (A33X)</div>
            <div id="bus-eta-container">載入數據中...</div>
        </div>

        <!-- 3. 港鐵班次卡片 -->
        <div class="card">
            <div class="card-title">MTR SCHEDULE (屯門站)</div>
            <div id="mtr-eta-container">載入數據中...</div>
        </div>
    </div>

    <!-- 底部電台播放器 -->
    <div class="radio-bar">
        <span style="font-weight:600; font-size:0.95rem; color:#8b949e;">LIVE BROADCAST</span>
        <div style="display:flex; gap:10px;">
            <button class="btn" onclick="playRadio('https://rthk.hk/live/radio1.m3u8')">RTHK 1</button>
            <button class="btn" onclick="playRadio('https://rthk.hk/live/radio2.m3u8')">RTHK 2</button>
        </div>
        <audio id="audio-player" controls></audio>
    </div>

    <script>
        // 1. 時鐘功能
        function updateClock() {
            var now = new Date();
            var h = String(now.getHours()).padStart(2, '0');
            var m = String(now.getMinutes()).padStart(2, '0');
            var s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').innerText = h + ':' + m + ':' + s;
            
            var year = now.getFullYear();
            var month = String(now.getMonth() + 1).padStart(2, '0');
            var date = String(now.getDate()).padStart(2, '0');
            var days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            document.getElementById('date').innerText = year + ' 年 ' + month + ' 月 ' + date + ' 日 ' + days[now.getDay()];
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 2. 天氣 API
        async function fetchWeather() {
            try {
                const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                const data = await res.json();
                if(data.temperature && data.temperature.data.length > 0) {
                    document.getElementById('temp').innerText = data.temperature.data[0].value + '°C';
                }
                if(data.humidity && data.humidity.data.length > 0) {
                    document.getElementById('humidity').innerText = data.humidity.data[0].value + '%';
                }
            } catch(e) { console.error(e); }
        }
        fetchWeather();
        setInterval(fetchWeather, 600000);

        // 3. 龍運/九巴 API (A33X - 屯門站總站)
        async function fetchBusEta() {
            // A33X 屬於龍運巴士 (LWB)，改為直接查詢路線所有到站時間，精準抓取「屯門站」
            try {
                const res = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/route-eta/A33X/1');
                const data = await res.json();
                
                // 篩選屯門站 (Stop ID: B042C9CBA3DF74DA 或 站名包含屯門)
                const etas = data.data.filter(item => item.seq === 1 || item.seq === 2).slice(0, 2);
                
                let html = '';
                if(!etas || etas.length === 0 || !etas[0].eta) { 
                    html = '<div style="color:#8b949e">目前無班次數據</div>'; 
                } else {
                    etas.forEach(eta => {
                        const etaTime = eta.eta ? new Date(eta.eta).toTimeString().substring(0, 5) : '未知';
                        const rmk = eta.rmk_tc ? ` (${eta.rmk_tc})` : '';
                        html += `<div class="eta-box"><span class="route-name">往 ${eta.dest_tc}${rmk}</span><span class="eta-time">${etaTime}</span></div>`;
                    });
                }
                document.getElementById('bus-eta-container').innerHTML = html;
            } catch(e) { 
                document.getElementById('bus-eta-container').innerText = '數據加載失敗'; 
            }
        }
        fetchBusEta();
        setInterval(fetchBusEta, 30000);

        // 4. 港鐵 API (屯馬綫 - 屯門站)
        async function fetchMtrEta() {
            const line = 'TUM';
            const sta = 'TUM';
            try {
                const res = await fetch(`https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=${line}&sta=${sta}`);
                const data = await res.json();
                
                let html = '';
                if (data.status === 1 && data.data && data.data[`${line}-${sta}`]) {
                    const stationData = data.data[`${line}-${sta}`];
                    
                    // 屯門站是屯馬綫起點/終點站，數據主要在 UP (往烏溪沙方向)
                    const trainList = stationData.UP || stationData.DOWN || [];
                    
                    if (trainList.length > 0) {
                        trainList.slice(0, 2).forEach(train => {
                            const min = train.ttnt ? `${train.ttnt} 分鐘` : '即將開出';
                            const dest = train.dest === 'WKS' ? '烏溪沙' : train.dest;
                            html += `<div class="eta-box mtr-box"><span class="route-name">往 ${dest} (月台 ${train.plat})</span><span class="eta-time">${min}</span></div>`;
                        });
                    }
                }
                
                document.getElementById('mtr-eta-container').innerHTML = html || '<div style="color:#8b949e">目前無班次數據</div>';
            } catch(e) {
                document.getElementById('mtr-eta-container').innerText = '數據加載失敗';
            }
        }
        fetchMtrEta();
        setInterval(fetchMtrEta, 30000);

        // 5. 電台播放
        function playRadio(url) {
            var player = document.getElementById('audio-player');
            player.src = url;
            player.play();
        }
    </script>
</body>
</html>
